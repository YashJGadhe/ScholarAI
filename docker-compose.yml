version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: scholarai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - scholarai_mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    container_name: scholarai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo

volumes:
  scholarai_mongo_data:
